name: Reproducibility checks

on:
  push:
  pull_request:

jobs:
  numerical-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python reproduce.py verify
      - run: python reproduce.py test -q
      - run: python reproduce.py synthetic verify-generator
      - run: python reproduce.py pruning paper --output results/table3
      - run: python reproduce.py ablation paper --output results/table4
